<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLEET RDC PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#0f172a;color:white;text-align:center}
h1{color:#38bdf8}
.card{background:white;color:#0f172a;padding:20px;border-radius:12px;max-width:500px;margin:20px auto;box-shadow:0 4px 20px rgba(0,0,0,0.3);text-align:left}
label{font-weight:bold;display:block;margin-top:12px}
input,select{width:100%;padding:12px;margin:6px 0 10px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.btn-bleu{background:#0f172a;color:white;padding:14px;width:100%;border:none;border-radius:8px;font-weight:bold;margin-top:10px;cursor:pointer}
.btn-vert{background:#16a34a;color:white;padding:12px;width:100%;border:none;border-radius:8px;margin-top:8px;cursor:pointer}
.result{background:#f1f5f9;padding:15px;border-radius:8px;margin-top:15px;color:#0f172a}
.alert-vol{background:#fde2e2;border-left:5px solid #ef4444;padding:12px;margin-top:10px;border-radius:6px}
.alert-ok{background:#dcfce7;border-left:5px solid #22c55e;padding:12px;margin-top:10px;border-radius:6px}
.type-selector{display:flex;gap:10px;margin:10px 0}
.type-btn{flex:1;padding:10px;border:2px solid #0f172a;border-radius:8px;background:white;cursor:pointer;font-weight:bold}
.type-btn.active{background:#0f172a;color:white}
.small{font-size:12px;color:#64748b}
</style>
</head>
<body>
<h1>FLEET RDC PRO</h1>
<p>Stop au vol de carburant à Kinshasa!</p>
<p style="color:#38bdf8">Vous perdez 900$ à 1500$ par mois par camion</p>

<div class="card">
<h3>Calcul Théorique vs Déclaré</h3>
<label>Nom Entreprise Client</label>
<input id="entreprise" placeholder="Ex: TRANSCO SARL">
<label>Camion</label>
<select id="camion"><option>Camion 1</option><option>Camion 2</option><option>Camion 3</option></select>

<label>Type de Trajet - NOUVEAU!</label>
<div class="type-selector">
<button class="type-btn active" id="btnVille" onclick="setType('ville')">Ville Kin (+30%)</button>
<button class="type-btn" id="btnProvince" onclick="setType('province')">Province Matadi</button>
</div>

<div id="chargeDiv" style="display:none">
<label>Charge</label>
<div class="type-selector">
<button class="type-btn active" id="btnCharge" onclick="setCharge('charge')">Chargé (30T)</button>
<button class="type-btn" id="btnVide" onclick="setCharge('vide')">Vide (retour)</button>
</div>
<p class="small">Vide = consomme 30% de moins, mais vole plus!</p>
</div>

<label>Client / Destination</label>
<input id="client" placeholder="Ex: Limete -> Matadi">
<label>Distance (km)</label>
<input id="kmDepart" type="number" value="45">
<label>Conso (L/100km) base</label>
<input id="conso" type="number" value="28">
<label>Carburant déclaré (L)</label>
<input id="carbDeclare" type="number" placeholder="Ex: 180">
<label>Prix Carburant (FC/L)</label>
<input id="prixCarb" type="number" value="3500">
<label>Facturation (FC)</label>
<input id="facturation" type="number" placeholder="150000">

<button class="btn-bleu" onclick="calculer()">CALCULER - DÉTECTER VOL</button>
<div id="result" class="result" style="display:none"></div>
<button class="btn-vert" onclick="sauvegarderCourse()" id="btnSave" style="display:none">Sauvegarder</button>
<button class="btn-vert" onclick="genererPDF()" style="background:#0f172a">Rapport PDF pour patron</button>
</div>

<div class="card">
<h4>Journal du jour - <span id="dateJour"></span></h4>
<div id="journal"></div>
<p><b>Total Vol du jour:</b> <span id="totalVol">0 FC</span></p>
</div>

<script>
let typeTrajet='ville'; let chargeType='charge';
let courses=JSON.parse(localStorage.getItem('fleetCourses')||'[]');
let dernierCalcul=null;
document.getElementById('dateJour').innerText=new Date().toLocaleDateString('fr-FR');
function setType(t){typeTrajet=t; document.getElementById('btnVille').classList.toggle('active',t==='ville'); document.getElementById('btnProvince').classList.toggle('active',t==='province'); document.getElementById('chargeDiv').style.display=t==='province'?'block':'none';}
function setCharge(c){chargeType=c; document.getElementById('btnCharge').classList.toggle('active',c==='charge'); document.getElementById('btnVide').classList.toggle('active',c==='vide');}
function calculer(){
 let km=parseFloat(document.getElementById('kmDepart').value);
 let consoBase=parseFloat(document.getElementById('conso').value);
 let carbDeclare=parseFloat(document.getElementById('carbDeclare').value);
 let prixCarb=parseFloat(document.getElementById('prixCarb').value);
 let fact=parseFloat(document.getElementById('facturation').value)||0;
 if(!km||!consoBase||!carbDeclare){alert('Remplis distance, conso et déclaré');return;}
 let litresTheorique; let explication;
 if(typeTrajet==='ville'){litresTheorique=(km*consoBase/100)*1.30; explication=`Base: ${(km*consoBase/100).toFixed(1)}L +30% bouchon Kin = ${litresTheorique.toFixed(1)}L`;}
 else{if(chargeType==='charge'){litresTheorique=(km*consoBase/100)*1.35; explication=`Base: ${(km*consoBase/100).toFixed(1)}L +35% collines+route+charge = ${litresTheorique.toFixed(1)}L`;}else{litresTheorique=(km*20/100)*1.15; explication=`Retour VIDE: Base 20L/100 +15% = ${litresTheorique.toFixed(1)}L - Doit consommer MOINS vide!`;}}
 let diff=carbDeclare-litresTheorique; let benef=fact-(carbDeclare*prixCarb); let alerte='';
 if(diff>5){let volFC=diff*prixCarb; alerte=`<div class="alert-vol">VOL DETECTE: ${diff.toFixed(1)}L = ${volFC.toFixed(0)} FC!<br><small>${explication}</small></div>`;}
 else if(diff<-5){alerte=`<div class="alert-ok">ECONOMIE: ${Math.abs(diff).toFixed(1)}L - Honnete!</div>`;}
 else{alerte=`<div class="alert-ok">CONSO NORMALE: ${explication}</div>`;}
 document.getElementById('result').innerHTML=`<b>Theorique:</b> ${litresTheorique.toFixed(1)}L<br><b>Declare:</b> ${carbDeclare}L<br><b>Diff:</b> ${diff.toFixed(1)}L<br><b>Benefice:</b> ${benef.toFixed(0)} FC<br>${alerte}`;
 document.getElementById('result').style.display='block'; document.getElementById('btnSave').style.display='block';
 dernierCalcul={km,consoBase,carbDeclare,litresTheorique,diff,prixCarb,benef,typeTrajet,chargeType,client:document.getElementById('client').value,camion:document.getElementById('camion').value,date:new Date().toLocaleString('fr-FR')};
}
function sauvegarderCourse(){if(!dernierCalcul)return; courses.push(dernierCalcul); localStorage.setItem('fleetCourses',JSON.stringify(courses)); afficherJournal(); alert('Sauvegardé!');}
function afficherJournal(){let html=''; let total=0; courses.forEach(c=>{let vol=c.diff>0?c.diff*c.prixCarb:0; total+=vol; html+=`<div style="border-bottom:1px solid #ddd;padding:6px 0;font-size:13px">${c.date} - ${c.camion} - ${c.client||c.km+'km'} - ${c.typeTrajet}/${c.chargeType} - Vol: ${c.diff.toFixed(1)}L (${vol.toFixed(0)}FC)</div>`;}); document.getElementById('journal').innerHTML=html||'Aucune course'; document.getElementById('totalVol').innerText=total.toFixed(0)+' FC';}
afficherJournal();
function genererPDF(){const {jsPDF}=window.jspdf; const doc=new jsPDF(); let entreprise=document.getElementById('entreprise').value||'FLEET RDC PRO'; doc.setFontSize(16); doc.text(entreprise+' - RAPPORT OFFICIEL',10,20); doc.setFontSize(10); doc.text('Date: '+new Date().toLocaleString('fr-FR'),10,30); let y=50; if(courses.length===0&&dernierCalcul){courses=[dernierCalcul];} courses.forEach((c,i)=>{doc.text(`${i+1}. ${c.camion} | ${c.client} | ${c.km}km | Theo:${c.litresTheorique.toFixed(1)}L Decl:${c.carbDeclare}L | Diff:${c.diff.toFixed(1)}L | ${c.typeTrajet} ${c.chargeType}`,10,y); y+=7; if(y>280){doc.addPage(); y=20;}}); let totalVol=courses.reduce((s,c)=>s+(c.diff>0?c.diff*c.prixCarb:0),0); doc.setFontSize(14); doc.text(`TOTAL VOL: ${totalVol.toFixed(0)} FC`,10,y+10); doc.save(`Rapport_${entreprise}.pdf`);}
</script>
</body>
</html>
