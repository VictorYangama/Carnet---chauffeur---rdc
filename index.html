<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet Chauffeur RDC - Victor Yangama</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:15px}
.header{background:linear-gradient(135deg,#007fff,#ff0000,#ffeb00);color:white;padding:20px;border-radius:15px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
.header h1{margin:0;font-size:22px}
.header p{margin:5px 0 0 0;opacity:0.9}
.card{background:white;padding:20px;border-radius:15px;margin-top:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
label{font-weight:bold;display:block;margin-top:12px;color:#333}
input{width:100%;padding:12px;margin-top:5px;border:2px solid #ddd;border-radius:8px;font-size:16px;box-sizing:border-box}
button{background:#007fff;color:white;border:none;padding:15px;width:100%;border-radius:10px;font-size:18px;font-weight:bold;margin-top:15px;cursor:pointer}
.result{background:#e8f5e9;padding:15px;border-radius:10px;margin-top:15px;display:none;border-left:5px solid #00c853}
.benefice{font-size:24px;font-weight:bold;color:#00c853}
.footer{text-align:center;margin-top:20px;color:#888;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1>🚚 CARNET CHAUFFEUR RDC 🇨🇩</h1>
<p>Par Victor Yangama - Chauffeur Pro Kinshasa</p>
</div>

<div class="card">
<label>👤 Nom du client / Destination</label>
<input id="client" type="text" placeholder="Ex: Gombe - Matonge">

<label>📏 Distance (km)</label>
<input id="km" type="number" placeholder="Ex: 15">

<label>⛽ Consommation (Litre/100km)</label>
<input id="conso" type="number" value="8" placeholder="Ex: 8">

<label>💰 Prix 1 Litre Carburant (FC)</label>
<input id="prixCarb" type="number" value="3500" placeholder="Ex: 3500">

<label>💵 Prix payé par client (FC)</label>
<input id="prixCourse" type="number" placeholder="Ex: 25000">

<button onclick="calculer()">CALCULER MON BÉNÉFICE 💰</button>

<div id="resultat" class="result">
<p>⛽ Carburant utilisé: <b id="rCarb"></b></p>
<p>💸 Coût carburant: <b id="rCout"></b> FC</p>
<p>💵 Prix course: <b id="rPrix"></b> FC</p>
<hr>
<p>🎉 MON BÉNÉFICE NET:</p>
<div class="benefice" id="rBenef"></div>
<p id="msg"></p>
</div>
</div>

<div class="footer">App créée à Kinshasa par Victor Yangama - 2026<br>Tous droits réservés chauffeurs RDC</div>

<script>
function calculer(){
let km=parseFloat(document.getElementById('km').value)||0;
let conso=parseFloat(document.getElementById('conso').value)||0;
let prixCarb=parseFloat(document.getElementById('prixCarb').value)||0;
let prixCourse=parseFloat(document.getElementById('prixCourse').value)||0;
let client=document.getElementById('client').value;

if(km==0 || prixCourse==0){alert("Remplis la distance et le prix de la course !");return;}

let litres=(km*conso)/100;
let cout=litres*prixCarb;
let benef=prixCourse-cout;

document.getElementById('rCarb').innerText=litres.toFixed(2)+" Litres";
document.getElementById('rCout').innerText=cout.toFixed(0);
document.getElementById('rPrix').innerText=prixCourse.toFixed(0);
document.getElementById('rBenef').innerText=benef.toFixed(0)+" FC";

let msgEl=document.getElementById('msg');
if(benef>10000) msgEl.innerText="🔥 Excellente course "+client+" ! Kitoko !";
else if(benef>0) msgEl.innerText="👍 Course rentable, continue !";
else msgEl.innerText="⚠️ Tu perds de l'argent sur cette course !";

document.getElementById('resultat').style.display='block';
}
</script>
</body>
</html>
